<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesi&oacute;n | PlateMind</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { align-items:center; background:#0b2b51; color:#10233f; display:flex; font-family:"Segoe UI",Arial,sans-serif; justify-content:center; margin:0; min-height:100vh; padding:28px; }
        .login-shell { text-align:center; width:100%; }
        .brand-panel { color:#fff; display:flex; justify-content:center; }
        .brand { align-items:center; display:flex; font-size:28px; font-weight:700; gap:13px; letter-spacing:0; }
        .brand-icon { display:grid; gap:4px; grid-template-columns:repeat(2,10px); grid-template-rows:repeat(2,10px); transform:rotate(45deg); }
        .brand-icon i { border-radius:2px; display:block; }
        .brand-icon i:nth-child(1) { background:#8b5cf6; }
        .brand-icon i:nth-child(2) { background:#ec4899; }
        .brand-icon i:nth-child(3) { background:#06b6d4; }
        .brand-icon i:nth-child(4) { background:#6366f1; }
        .form-panel { display:flex; justify-content:center; padding-top:28px; }
        main { background:#fff; border-radius:8px; box-shadow:0 14px 30px rgba(0,0,0,.18); max-width:390px; padding:28px; text-align:left; width:100%; }
        label { color:#364152; display:block; font-size:13px; font-weight:600; margin:0 0 8px; }
        label + input { margin-bottom:18px; }
        input { background:#fff; border:1px solid #d7e0ea; border-radius:6px; color:#10233f; font:inherit; font-size:15px; outline:0; padding:12px 13px; transition:border-color .18s ease, box-shadow .18s ease; width:100%; }
        input:focus { border-color:#1288c8; box-shadow:0 0 0 3px rgba(18,136,200,.14); }
        button { background:#0b2b51; border:0; border-radius:6px; color:#fff; cursor:pointer; font:inherit; font-size:15px; font-weight:600; margin-top:8px; padding:13px; transition:background .18s ease, transform .18s ease; width:100%; }
        button:hover { background:#16446f; }
        button:active { transform:translateY(1px); }
        .error { background:#fff0f0; border:1px solid #f3caca; border-radius:6px; color:#a52a2a; font-size:13px; margin-top:20px; padding:11px 12px; }
        @media (max-width:480px) { body { padding:22px; } .brand { font-size:24px; } main { padding:24px; } }
    </style>
</head>
<body>
    <div class="login-shell">
        <aside class="brand-panel" aria-label="PlateMind">
            <div class="brand">
                <span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                <span>PlateMind</span>
            </div>
        </aside>

        <section class="form-panel">
            <main>
                <form method="post">
                    {% csrf_token %}
                    <label for="id_username">Usuario</label>
                    <input id="id_username" name="username" type="text" autocomplete="username" autofocus required>
                    <label for="id_password">Contrase&ntilde;a</label>
                    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
                    {% if form.errors %}<div class="error">Usuario o contrase&ntilde;a incorrectos.</div>{% endif %}
                    <button type="submit">Ingresar</button>
                    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                </form>
            </main>
        </section>
    </div>
</body>
</html>
