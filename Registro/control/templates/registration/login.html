<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | PlateMind</title>
    <style>
        * { box-sizing: border-box; }
        body { align-items:center; background:linear-gradient(135deg,#1e3a8a,#2563eb); display:flex; font-family:"Segoe UI",Arial,sans-serif; justify-content:center; margin:0; min-height:100vh; padding:20px; }
        main { background:#fff; border-radius:12px; box-shadow:0 18px 45px rgba(0,0,0,.25); max-width:390px; padding:36px; width:100%; }
        h1 { color:#1e40af; font-size:27px; margin:0 0 8px; }
        p { color:#64748b; margin:0 0 28px; }
        label { color:#334155; display:block; font-size:14px; font-weight:600; margin:16px 0 7px; }
        input { border:1px solid #cbd5e1; border-radius:6px; font-size:16px; padding:11px; width:100%; }
        button { background:#1e40af; border:0; border-radius:6px; color:#fff; cursor:pointer; font-size:16px; font-weight:600; margin-top:26px; padding:12px; width:100%; }
        .error { background:#fef2f2; border-radius:6px; color:#b91c1c; font-size:14px; margin-top:18px; padding:10px; }
    </style>
</head>
<body>
    <main>
        <h1>PlateMind</h1>
        <p>Control vehicular — acceso restringido</p>
        <form method="post">
            {% csrf_token %}
            <label for="id_username">Usuario</label>
            <input id="id_username" name="username" type="text" autocomplete="username" autofocus required>
            <label for="id_password">Contraseña</label>
            <input id="id_password" name="password" type="password" autocomplete="current-password" required>
            {% if form.errors %}<div class="error">Usuario o contraseña incorrectos.</div>{% endif %}
            <button type="submit">Ingresar</button>
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        </form>
    </main>
</body>
</html>
